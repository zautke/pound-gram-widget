name: PoundsGrams
options:
  bundleIdPrefix: com.braisenly.pounds-grams
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    DEVELOPMENT_TEAM: ""
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete

packages:
  ConversionKit:
    path: Packages/ConversionKit

targets:
  PoundsGrams:
    type: application
    platform: iOS
    sources:
      - path: App
    resources:
      - path: App/Assets.xcassets
        optional: true
    dependencies:
      - package: ConversionKit
      - target: PoundsGramsWidget
        embed: true
        codeSign: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: PoundsGrams
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        NSMicrophoneUsageDescription: PoundsGrams listens for a quantity and a unit so it can convert between pounds and grams.
        NSSpeechRecognitionUsageDescription: PoundsGrams uses speech recognition to understand the quantity and unit you say.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        CFBundleURLTypes:
          - CFBundleURLName: com.braisenly.pounds-grams.url
            CFBundleURLSchemes:
              - poundsgrams
        UIRequiredDeviceCapabilities:
          - arm64
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.braisenly.pounds-grams
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: App/PoundsGrams.entitlements
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/Info.plist

  PoundsGramsWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
    dependencies:
      - package: ConversionKit
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: PoundsGrams Widget
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.braisenly.pounds-grams.widget
        CODE_SIGN_ENTITLEMENTS: Widget/PoundsGramsWidget.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Widget/Info.plist

schemes:
  PoundsGrams:
    build:
      targets:
        PoundsGrams: all
        PoundsGramsWidget: all
    run:
      config: Debug
    test:
      config: Debug
      targets: []
    archive:
      config: Release
